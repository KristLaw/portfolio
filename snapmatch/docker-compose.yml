version: '3.9'

services:
  backend:
    build: ./backend
    ports:
      - '8000:8000'
    environment:
      - LINE_CHANNEL_TOKEN=${LINE_CHANNEL_TOKEN}
      - LINE_CHANNEL_SECRET=${LINE_CHANNEL_SECRET}
      - DATABASE_URL=sqlite:///./snapmatch.db
      - UPLOAD_DIR=/app/uploads
      - BASE_URL=http://localhost:8000
    volumes:
      - uploads:/app/uploads
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - '3000:3000'
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  uploads:
